[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocron-sentinel"
version = "2.0.0"
description = "Multi-tenant AWS security auditing API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43,<2",
    "fastapi>=0.136,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.48,<1",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.black]
target-version = ["py312"]
